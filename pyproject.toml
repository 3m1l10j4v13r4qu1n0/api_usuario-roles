[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "B008",
    "DTZ007",  # fechas naive intencionales: el dominio trabaja con dates sin zona horaria
]

[tool.ruff.lint.per-file-ignores]
# Adapter de Google: catch-all que envuelve errores de gspread en SincronizacionError
"app/infrastructure/google/google_sheets_client.py" = ["BLE001"]