[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "B008",
    "DTZ007",  # fechas naive intencionales: el dominio trabaja con dates sin zona horaria
]

[tool.pytest.ini_options]
addopts = "--ignore=tests/integration"
markers = [
    "integracion: requiere una base de datos real (PostgreSQL via .env)",

]